<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.botpress.cloud/webchat/v3.4/inject.js"></script>
<script src="https://files.bpcontent.cloud/2025/11/30/16/20251130161731-GE7EHZWU.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The EcoConnect Initiative – Empowering communities for a greener future</title>

  <!-- Elegant, eco-inspired typography -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-deep: #07130d;          /* deep forest */
      --bg-olive: #233624;         /* olive base */
      --bg-olive-soft: #2f4530;    /* slightly lighter olive */
      --bg-accent-layer: #152016;  /* darker layer under cards */
      --card-surface: #324a30;     /* main card */
      --card-alt: #3c5a39;         /* alternate card */
      --accent-seed: #d8c38a;      /* warm seed / highlight */
      --accent-soft: #f4efe1;      /* very soft cream */
      --accent-tag: #c58f5a;       /* warm tag / button */
      --text-main: #f5f7f1;
      --text-muted: #c3d3c0;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --shadow-soft: 0 20px 40px rgba(0, 0, 0, 0.45);
      --radius-xl: 1.75rem;
      --radius-lg: 1.25rem;
      --radius-pill: 999px;
      --transition-fast: 200ms ease;
      --transition-med: 260ms ease;
      --nav-height: 74px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, #1e2f23 0, #07130d 48%, #050c08 100%);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top left, rgba(216, 195, 138, 0.14), transparent 55%),
        radial-gradient(circle at bottom right, rgba(119, 170, 129, 0.22), transparent 60%),
        linear-gradient(145deg, var(--bg-deep), var(--bg-olive));
    }

    .max-width {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* --- Header & Navigation --- */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: linear-gradient(to bottom, rgba(7, 19, 13, 0.9), rgba(7, 19, 13, 0.7));
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .nav {
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 1.4rem;
      background: conic-gradient(from 160deg, #d8c38a, #78a46b, #324a30, #d8c38a);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: inherit;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .brand-text h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
    }

    .brand-text span {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.9rem;
    }

    .nav-links a {
      position: relative;
      padding: 0.2rem 0;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -0.25rem;
      width: 0;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-seed), #9ac783);
      transition: width var(--transition-med);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-pill);
      background: radial-gradient(circle at top left, #f4efe1, #d8c38a);
      color: #1b261b;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
    }

    .nav-cta span {
      font-size: 1.1rem;
    }

    .nav-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.6);
      background: radial-gradient(circle at top left, #ffffff, #e4d4a4);
    }

    .nav-toggle {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(7, 19, 13, 0.9);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .nav-toggle span {
      width: 18px;
      height: 2px;
      background: var(--text-main);
      border-radius: 999px;
      position: relative;
    }

    .nav-toggle span::before,
    .nav-toggle span::after {
      content: '';
      position: absolute;
      left: 0;
      width: 18px;
      height: 2px;
      background: var(--text-main);
      border-radius: 999px;
    }

    .nav-toggle span::before {
      top: -6px;
    }

    .nav-toggle span::after {
      top: 6px;
    }

    /* --- Hero --- */
    .hero {
      padding: 3.5rem 0 3rem;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 2.75rem;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.17);
      background: linear-gradient(120deg, rgba(50, 74, 48, 0.8), rgba(7, 19, 13, 0.6));
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }

    .eyebrow-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #d8c38a);
      box-shadow: 0 0 0 4px rgba(216, 195, 138, 0.18);
    }

    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 3vw, 3rem);
      line-height: 1.1;
      margin-bottom: 1rem;
    }
-size: 0.7rem;
